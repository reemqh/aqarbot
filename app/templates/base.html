<!DOCTYPE html>
<html lang="{{ 'ar' if request.cookies.get('lang', 'ar') == 'ar' else 'en' }}"
    dir="{{ 'rtl' if request.cookies.get('lang', 'ar') == 'ar' else 'ltr' }}"
    class="{{ 'rtl' if request.cookies.get('lang', 'ar') == 'ar' else 'ltr' }}"
    data-lang="{{ request.cookies.get('lang', 'ar') }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AqarBot{% endblock %}</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'aqar-dark': '#0f2b1f',
                        'aqar-green': '#2f6a4a',
                        'aqar-mint': '#a8e6c3',
                        'aqar-bg': '#f5f5f4',
                    }
                }
            }
        }
    </script>

    {% block head_extra %}{% endblock %}
</head>

<body class="min-h-screen bg-aqar-bg text-gray-900 antialiased">

    <!-- Navbar -->
    <nav class="bg-aqar-dark text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex-shrink-0">
                    <a href="/" class="text-2xl font-bold tracking-tight flex items-center">
                        <span class="text-aqar-mint">Aqar</span><span class="text-white">Bot</span>
                    </a>
                </div>

                <!-- Language Toggle -->
                <div class="flex items-center space-x-4">
                    {% set current_lang = request.cookies.get('lang', 'ar') %}
                    <a href="{{ url_for('set_language', lang='en' if current_lang == 'ar' else 'ar') }}" class="flex items-center px-3 py-2 rounded-md text-sm font-medium 
                              bg-aqar-green hover:bg-aqar-mint hover:text-aqar-dark transition-colors">
                        <i class="fas fa-globe mr-2"></i>
                        {{ 'English' if current_lang == 'ar' else 'العربية' }}
                    </a>
                </div>

            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="flex-grow">
        <div id="app" class="min-h-[calc(100vh-4rem)]">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block scripts %}
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    {% endblock %}
</body>

</html>
